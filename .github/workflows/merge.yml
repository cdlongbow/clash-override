name: Merge Override Script

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'merge_override.py'
      - 'custom_rules.yaml'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/merge.yml'
  pull_request:

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install -r requirements.txt pytest

      - name: 运行测试
        run: python -m pytest -q

      - name: 运行合并脚本
        run: python merge_override.py

      - name: 提交生成的文件
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add my_merged_override.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update merged script [skip ci]" && git push)
